<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusEvents</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand">
                <span class="brand-icon">🎓</span>
                <span>CampusEvents</span>
            </a>
            <ul class="nav-links">
                <li><a href="/index.html">Upcoming Events</a></li>
                <span id="navAuthLinks">
                    <li><a href="/login.html" class="btn btn-outline btn-sm active">Login</a></li>
                    <li><a href="/register.html" class="btn btn-primary btn-sm">Register</a></li>
                </span>
            </ul>
        </div>
    </nav>

    <!-- Main Auth Content -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your Student or Admin account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@college.edu" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Sign In
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="demo-credentials-box">
                <h4>⚡ Quick Demo Autofill:</h4>
                <p style="color: var(--gray-600); margin-bottom: 0.4rem;">Click a button below to test either role instantly:</p>
                <div class="demo-btn-group">
                    <button type="button" class="btn btn-outline btn-sm" id="fillAdminBtn">🛡️ Demo Admin</button>
                    <button type="button" class="btn btn-outline btn-sm" id="fillStudentBtn">👨‍🎓 Demo Student</button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--gray-600);">
                Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register as Student</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 CampusEvents. College Event Management System.</p>
    </footer>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script>
        // Check if already logged in
        async function checkAlreadyLoggedIn() {
            const user = await getCurrentUser();
            if (user) {
                if (user.role === 'admin') {
                    window.location.href = '/admin-dashboard.html';
                } else {
                    window.location.href = '/student-dashboard.html';
                }
            }
        }
        checkAlreadyLoggedIn();

        // Demo Autofill buttons
        document.getElementById('fillAdminBtn').addEventListener('click', () => {
            document.getElementById('email').value = 'admin@college.edu';
            document.getElementById('password').value = 'admin123';
        });

        document.getElementById('fillStudentBtn').addEventListener('click', () => {
            document.getElementById('email').value = 'rahul@student.edu';
            document.getElementById('password').value = 'student123';
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Signing In...';

            try {
                const response = await apiRequest('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                showToast(response.message, 'success');

                setTimeout(() => {
                    if (response.user.role === 'admin') {
                        window.location.href = '/admin-dashboard.html';
                    } else {
                        window.location.href = '/student-dashboard.html';
                    }
                }, 600);
            } catch (err) {
                showToast(err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';
            }
        });
    </script>
</body>
</html>
